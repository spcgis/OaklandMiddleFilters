            var hoveredNode = data.points[0].pointNumber;

            if (originIds.has(hoveredNode)) {
                var activeTrips = trips.filter(t => t.origin_id === hoveredNode);

                var highlightedLinks = new Set();
                var destBreakdown = {};

                activeTrips.forEach(function(t) {
                    // Match BOTH Left (Column C -> Column H) AND Right (Column H -> Column L) links
                    links.forEach(function(l, idx) {
                        // Left link match
                        if (l.source_id === t.origin_id && l.target_id === t.middle_id) {
                            highlightedLinks.add(idx);
                        }
                        // Right link match
                        if (l.source_id === t.middle_id && l.target_id === t.dest_id) {
                            highlightedLinks.add(idx);
                        }
                    });

                    // Group sum Column R per Column L destination

                var newColors = new Array(links.length).fill(defaultColor);
